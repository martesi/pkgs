name: AgentDock

on:
  push:
    branches: [main]
    paths:
      - "agentdock/**"
      - ".github/workflows/agentdock.yml"
  pull_request:
    paths:
      - "agentdock/**"
      - ".github/workflows/agentdock.yml"
  workflow_dispatch:

permissions:
  contents: write
  packages: write

concurrency:
  group: agentdock-publish
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Read image version
        run: |
          if [[ "${{ github.event_name }}" != "pull_request" && "${{ github.ref }}" == "refs/heads/main" ]]; then
            git fetch origin main
            ref=origin/main
          else
            ref=HEAD
          fi
          echo "IMAGE_VERSION=$(git show "$ref:agentdock/manifest.json" | jq -r .version)" >> "$GITHUB_ENV"

      - name: Build image
        run: docker build -t "ghcr.io/martesi/agentdock:${IMAGE_VERSION}" agentdock

      - name: Validate toolchain
        run: |
          image="ghcr.io/martesi/agentdock:${IMAGE_VERSION}"
          docker run --rm --entrypoint sh "$image" -lc '
            test "$(id -un)" = agentdock
            test -d /nix/store
            nix --version
            nix store info
            jj --version
            bun --version
            nix profile add nixpkgs#hello
            "$HOME/.nix-profile/bin/hello"
          '

      - name: Publish image
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "$GHCR_TOKEN" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          docker push "ghcr.io/martesi/agentdock:${IMAGE_VERSION}"

      - name: Advance image version
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        run: |
          git fetch origin main
          git checkout -B main origin/main
          jq ".version = $((IMAGE_VERSION + 1))" agentdock/manifest.json > agentdock/manifest.json.tmp
          mv agentdock/manifest.json.tmp agentdock/manifest.json
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add agentdock/manifest.json
          git commit -m "chore: advance agentdock image version [skip ci]"
          git push origin main
