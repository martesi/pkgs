name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write
  packages: write

concurrency:
  group: caddy-publish
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Read Caddy image version
        run: |
          if [[ "${{ github.event_name }}" != "pull_request" && "${{ github.ref }}" == "refs/heads/main" ]]; then
            git fetch origin main
            version="$(git show origin/main:caddy/manifest.json | jq -r .version)"
          else
            version="$(jq -r .version caddy/manifest.json)"
          fi
          echo "CADDY_IMAGE_VERSION=$version" >> "$GITHUB_ENV"

      - name: Build Caddy image
        run: docker build -t "ghcr.io/martesi/caddy:${CADDY_IMAGE_VERSION}" caddy

      - name: Publish Caddy image
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "$GHCR_TOKEN" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          docker push "ghcr.io/martesi/caddy:${CADDY_IMAGE_VERSION}"

      - name: Advance Caddy image version
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        run: |
          git fetch origin main
          git checkout -B main origin/main
          jq ".version = $((CADDY_IMAGE_VERSION + 1))" caddy/manifest.json > caddy/manifest.json.tmp
          mv caddy/manifest.json.tmp caddy/manifest.json
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add caddy/manifest.json
          git commit -m "chore: advance caddy image version [skip ci]"
          git push origin main
