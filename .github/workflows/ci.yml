name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 8 * * *"
  workflow_dispatch:

permissions:
  contents: write
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: cachix/install-nix-action@v31

      - name: Update pins
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        run: ./scripts/update.sh

      - name: Check
        run: nix flake check --print-build-logs

      - name: Build Caddy image
        run: nix build .#caddy --out-link caddy.img

      - name: Commit updated pins
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add pins.json
          git commit -m "chore: update pins"
          git push

      - name: Publish Caddy image
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          nix develop -c skopeo copy \
            --dest-creds "${{ github.actor }}:$GHCR_TOKEN" \
            docker-archive:caddy.img \
            docker://ghcr.io/martesi/caddy:latest
